name: "Godot Android Build"
on: [push, pull_request]

env:
  GODOT_VERSION: 4.2.2
  EXPORT_NAME: AFKPaperGame

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Android Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Setup Export Presets for Keystore
        run: |
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"debug.keystore\"|" export_presets.cfg
          sed -i "s|keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|" export_presets.cfg
          sed -i "s|keystore/debug_password=\"\"|keystore/debug_password=\"android\"|" export_presets.cfg

      - name: Setup Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -s /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Setup Editor Settings
        run: |
          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> ~/.config/godot/editor_settings-4.tres
          JAVA_PATH=$(find /usr/lib/jvm -maxdepth 1 -type d -name "java-*-openjdk-amd64" | head -n 1)
          if [ -z "$JAVA_PATH" ]; then JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java)))); fi
          echo "export/android/java_sdk_path = \"$JAVA_PATH\"" >> ~/.config/godot/editor_settings-4.tres

      - name: Build Android
        run: |
          mkdir -p build/android
          godot -v --headless --export-debug "Android" build/android/${EXPORT_NAME}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/${EXPORT_NAME}.apk
